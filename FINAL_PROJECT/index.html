<!DOCTYPE html>
<html lang="en">
    <head>
    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Document</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <header id="header">
            <h3><span>M</span>Quiz</h3>
            <a href="http://koceila.com" class="dark-btn btn-md"> My website </a>
        </header>
        <main>
            
            <section id="welcomeFrame" class="frame welcome_frame">
                <div class="welcome_frame_hero">
                    <div class="welcome_frame_hero_content">
                        <h1><span>Welcome</span> to math quiz!</h1>
                        <p>Test your math skills and see how many questions you can answer correctly.</p>
                        <div class="welcome_frame_hero_content_buttons">
                            <button id="startButton" class="primary-btn btn-lg">Start Quiz</button>
                            <button id="startButton" class="secondary-btn btn-lg">Start Quiz</button>
                        </div>
                    </div>
                    <div class="welcome_frame_hero_img">
                        <img src="./img/img.png" alt="">
                    </div>
                </div>
                <div id="modal" class="welcome_frame_level">
                    <div class="welcome_frame_level_content">
                        <button id="levelEasy" class="btn-md primary-btn">easy</button>
                        <button id="levelNormal" class="btn-md primary-btn">normal</button>
                        <button id="levelHard" class="btn-md primary-btn">hard</button>
                        <button id="closeModal" class="btn-md primary-btn">x</button>
                    </div>
                </div>
            </section>
            
            <section id="gameFrame" class="frame game_frame">
                
            </section>
            
            <section id="scoreFrame" class="frame score_frame">
            
            <section id="scoreFrame" class="frame score_frame">
                
            </section>
        </main>
        <footer id="footer">
            <div>
                <h3>About</h3>
                <p>lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            </div>
        </footer>
        
    </body>
